<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="x-coach">
  <title>x-coach</title>
  <!-- rounded app-icon background -->
  <rect width="128" height="128" rx="28" fill="#121416"/>
  <rect x="0.75" y="0.75" width="126.5" height="126.5" rx="27.25" fill="none" stroke="#2a2e33" stroke-width="1.5"/>

  <!-- ground line -->
  <line x1="30" y1="103" x2="98" y2="103" stroke="#2a2e33" stroke-width="3" stroke-linecap="round"/>

  <!-- knee-angle arc (the "explainable" measurement) -->
  <path d="M64 80 A 16 16 0 0 1 78 88" fill="none" stroke="#42d159" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>

  <!-- skeleton bones: squatting figure, side profile facing right -->
  <g stroke="#0f758a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- head to shoulder -->
    <line x1="49" y1="36" x2="50" y2="48"/>
    <!-- torso: shoulder to hip -->
    <line x1="50" y1="48" x2="46" y2="74"/>
    <!-- thigh: hip to knee -->
    <line x1="46" y1="74" x2="72" y2="80"/>
    <!-- shin: knee to ankle -->
    <line x1="72" y1="80" x2="68" y2="102"/>
    <!-- foot -->
    <line x1="60" y1="102" x2="84" y2="102"/>
    <!-- arm: shoulder to elbow to wrist (reaching forward) -->
    <line x1="50" y1="48" x2="66" y2="56"/>
    <line x1="66" y1="56" x2="82" y2="54"/>
  </g>

  <!-- pose keypoints -->
  <g fill="#42d159" stroke="#121416" stroke-width="2">
    <circle cx="50" cy="48" r="4.5"/>  <!-- shoulder -->
    <circle cx="46" cy="74" r="4.5"/>  <!-- hip -->
    <circle cx="72" cy="80" r="5"/>    <!-- knee (key joint) -->
    <circle cx="68" cy="102" r="4.5"/> <!-- ankle -->
    <circle cx="66" cy="56" r="4"/>    <!-- elbow -->
    <circle cx="82" cy="54" r="4"/>    <!-- wrist -->
  </g>

  <!-- head -->
  <circle cx="48" cy="30" r="8" fill="#0f758a" stroke="#42d159" stroke-width="2.5"/>
</svg>
