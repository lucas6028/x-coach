<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="x-coach">
  <title>x-coach</title>

  <defs>
    <!-- punchy background gradient for instant recognition at small sizes -->
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#15323a"/>
      <stop offset="1" stop-color="#0d1113"/>
    </linearGradient>
    <!-- bright bone gradient: teal -> lime, high contrast on dark -->
    <linearGradient id="bone" x1="28" y1="20" x2="104" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5ffb6f"/>
      <stop offset="1" stop-color="#16b8a8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#42d159" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#42d159" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- rounded app-icon background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- soft glow behind the figure so the skeleton pops -->
  <circle cx="62" cy="62" r="52" fill="url(#glow)"/>

  <!-- ground line -->
  <line x1="22" y1="110" x2="106" y2="110" stroke="#3a4a4f" stroke-width="4" stroke-linecap="round"/>

  <!-- knee-angle arc: the "explainable" measurement accent -->
  <path d="M84 84 A 22 22 0 0 1 70 110" fill="none" stroke="#ffd23f" stroke-width="4" stroke-linecap="round"/>

  <!-- skeleton bones: bold squatting side profile, fills the canvas -->
  <g stroke="url(#bone)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- neck to hip (torso) -->
    <line x1="47" y1="40" x2="40" y2="78"/>
    <!-- thigh: hip to knee -->
    <line x1="40" y1="78" x2="86" y2="84"/>
    <!-- shin: knee to ankle -->
    <line x1="86" y1="84" x2="74" y2="110"/>
    <!-- foot -->
    <line x1="60" y1="110" x2="94" y2="110"/>
    <!-- arm: shoulder reaching forward -->
    <line x1="47" y1="44" x2="92" y2="50"/>
  </g>

  <!-- pose keypoints: bright, large, with dark halo for separation -->
  <g fill="#eafff0" stroke="#0d1113" stroke-width="2.5">
    <circle cx="47" cy="42" r="6"/>   <!-- shoulder -->
    <circle cx="40" cy="78" r="6"/>   <!-- hip -->
    <circle cx="86" cy="84" r="7.5"/> <!-- knee (key joint) -->
    <circle cx="74" cy="110" r="6"/>  <!-- ankle -->
    <circle cx="92" cy="50" r="5.5"/> <!-- wrist -->
  </g>

  <!-- head: bold, bright outline -->
  <circle cx="49" cy="26" r="12" fill="url(#bone)" stroke="#eafff0" stroke-width="3"/>
</svg>
