<svg width="420" height="128" viewBox="0 0 420 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="x-coach — explainable squat coaching">
  <title>x-coach</title>

  <!-- ===== icon mark ===== -->
  <g>
    <!-- ground line -->
    <line x1="30" y1="103" x2="98" y2="103" stroke="#2a2e33" stroke-width="3" stroke-linecap="round"/>

    <!-- knee-angle arc -->
    <path d="M64 80 A 16 16 0 0 1 78 88" fill="none" stroke="#42d159" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>

    <!-- skeleton bones -->
    <g stroke="#0f758a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="49" y1="36" x2="50" y2="48"/>
      <line x1="50" y1="48" x2="46" y2="74"/>
      <line x1="46" y1="74" x2="72" y2="80"/>
      <line x1="72" y1="80" x2="68" y2="102"/>
      <line x1="60" y1="102" x2="84" y2="102"/>
      <line x1="50" y1="48" x2="66" y2="56"/>
      <line x1="66" y1="56" x2="82" y2="54"/>
    </g>

    <!-- keypoints -->
    <g fill="#42d159" stroke="#121416" stroke-width="2">
      <circle cx="50" cy="48" r="4.5"/>
      <circle cx="46" cy="74" r="4.5"/>
      <circle cx="72" cy="80" r="5"/>
      <circle cx="68" cy="102" r="4.5"/>
      <circle cx="66" cy="56" r="4"/>
      <circle cx="82" cy="54" r="4"/>
    </g>

    <!-- head -->
    <circle cx="48" cy="30" r="8" fill="#0f758a" stroke="#42d159" stroke-width="2.5"/>
  </g>

  <!-- ===== wordmark ===== -->
  <g font-family="'Space Grotesk', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="700">
    <text x="120" y="74" font-size="46" fill="#f3f4f6" letter-spacing="-1">x-<tspan fill="#0f758a">coach</tspan></text>
    <text x="122" y="98" font-size="15" font-weight="500" fill="#9aa0a6" letter-spacing="0.5">explainable squat coaching</text>
  </g>
</svg>
