<svg width="440" height="128" viewBox="0 0 440 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="x-coach — explainable squat coaching">
  <title>x-coach</title>

  <defs>
    <linearGradient id="bone" x1="28" y1="20" x2="104" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5ffb6f"/>
      <stop offset="1" stop-color="#16b8a8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#42d159" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#42d159" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ===== icon mark ===== -->
  <g>
    <circle cx="62" cy="62" r="52" fill="url(#glow)"/>

    <!-- ground line -->
    <line x1="22" y1="110" x2="106" y2="110" stroke="#3a4a4f" stroke-width="4" stroke-linecap="round"/>

    <!-- knee-angle arc -->
    <path d="M84 84 A 22 22 0 0 1 70 110" fill="none" stroke="#ffd23f" stroke-width="4" stroke-linecap="round"/>

    <!-- skeleton bones -->
    <g stroke="url(#bone)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="47" y1="40" x2="40" y2="78"/>
      <line x1="40" y1="78" x2="86" y2="84"/>
      <line x1="86" y1="84" x2="74" y2="110"/>
      <line x1="60" y1="110" x2="94" y2="110"/>
      <line x1="47" y1="44" x2="92" y2="50"/>
    </g>

    <!-- keypoints -->
    <g fill="#eafff0" stroke="#0d1113" stroke-width="2.5">
      <circle cx="47" cy="42" r="6"/>
      <circle cx="40" cy="78" r="6"/>
      <circle cx="86" cy="84" r="7.5"/>
      <circle cx="74" cy="110" r="6"/>
      <circle cx="92" cy="50" r="5.5"/>
    </g>

    <!-- head -->
    <circle cx="49" cy="26" r="12" fill="url(#bone)" stroke="#eafff0" stroke-width="3"/>
  </g>

  <!-- ===== wordmark ===== -->
  <g font-family="'Space Grotesk', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="700">
    <text x="130" y="74" font-size="46" fill="#f3f4f6" letter-spacing="-1">x-<tspan fill="url(#bone)">coach</tspan></text>
    <text x="132" y="98" font-size="15" font-weight="500" fill="#9aa0a6" letter-spacing="0.5">explainable squat coaching</text>
  </g>
</svg>
