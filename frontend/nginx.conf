# Serves the built SPA and stands in for Vite's dev proxy: /api -> the backend service,
# so the app keeps using same-origin relative URLs (see frontend/src/api.ts).

upstream xcoach_backend {
    # `backend` is the docker-compose service name. Override with BACKEND_HOST at build
    # time only if you rename the service.
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Video uploads go through this proxy. Analysis input is short phone clips; keep the
    # ceiling generous but finite so a stray upload can't fill the disk.
    client_max_body_size 256m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://xcoach_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/chat streams tokens (SSE). Buffering here would hold the whole reply until
        # the stream closed, which reads as a dead chat box.
        proxy_buffering off;
        proxy_cache off;

        # A cold analysis (MediaPipe + rules + RAG) can run for minutes; the default 60s
        # read timeout would 504 mid-run.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Vite emits content-hashed filenames under /assets, so they are safe to pin forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves clients on stale asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: react-router owns every other path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
