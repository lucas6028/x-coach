# Codecov configuration.
#
# Each mini-game keeps its gameplay logic in fully unit-tested pure modules (src/lib/*).
# What stays uncovered is the unavoidable impure boundary: the MediaPipe/WASM/WebGL/canvas
# wrappers and the thin camera + requestAnimationFrame page shells, none of which can run
# under jsdom. Those are ignored here (mirroring the vitest coverage `exclude`) so patch
# coverage reflects code that can actually be tested.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 75%
        threshold: 5%

ignore:
  - "frontend/src/main.tsx"
  - "frontend/src/test"
  # MediaPipe / camera / canvas boundaries — need a real camera + GPU.
  - "frontend/src/components/**/*Detector.ts"
  - "frontend/src/lib/poseProbe.ts"
  # Camera + rAF page shells: impure edges only; their logic is unit-tested in src/lib/*.
  - "frontend/src/pages/SixSeven.tsx"
  - "frontend/src/pages/FruitNinja.tsx"
