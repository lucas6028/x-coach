name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests & backend coverage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install lean CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      # Run the deterministic suite. The heavy (torch / opencv / mediapipe) and the
      # data-dependent integration modules are skipped - see requirements-ci.txt.
      - name: Run tests
        run: |
          python -m pytest tests/ -v \
            --ignore=tests/test_mediapipe_smoothing.py \
            --ignore=tests/test_rtmpose_pose_extraction.py \
            --ignore=tests/test_videomae_video_classifier.py \
            --ignore=tests/test_videomae_features_extraction.py \
            --ignore=tests/test_videomae_stage_a.py \
            --ignore=tests/test_video_level_error_classification.py \
            --ignore=tests/test_backend_analysis.py \
            --cov --cov-branch --cov-report=xml

      # Enforce backend coverage threshold separately.
      - name: Backend coverage
        run: |
          python scripts/run_backend_coverage.py --html --fail-under 95

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: py${{ matrix.python-version }}
          fail_ci_if_error: false

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-html-py${{ matrix.python-version }}
          path: htmlcov/
          if-no-files-found: ignore

  frontend:
    name: Frontend tests & coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Vitest enforces the coverage thresholds in vite.config.ts and writes lcov.
      - name: Run tests with coverage
        run: yarn test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage-html
          path: frontend/coverage/
          if-no-files-found: ignore
